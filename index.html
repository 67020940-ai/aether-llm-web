<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sable • Interactive Workspace</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Marked Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    code, pre {
      font-family: 'JetBrains Mono', monospace !important;
    }

    body {
      background-color: #08080a;
      color: #f1f1f4;
      overflow: hidden;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    /* 3D Background Canvas */
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Ambient Spotlight Glow */
    .ambient-glow {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 400px;
      background: radial-gradient(circle, rgba(140, 100, 255, 0.12) 0%, rgba(20, 20, 30, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* --- ThreeUI Animated Top Dock (Sable Capsule) --- */
    .sable-dock-wrapper {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 9999px;
      background: rgba(18, 18, 24, 0.7);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 16px 40px -10px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sable-dock-wrapper:hover {
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 
        0 20px 50px -10px rgba(0, 0, 0, 0.9),
        0 0 30px rgba(168, 85, 247, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .dock-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      color: #9496a1;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      outline: none;
      border: none;
      background: transparent;
    }

    .dock-item:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(3px) scale(1.15);
    }

    .dock-item.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05);
    }

    .dock-item .dock-tooltip {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(-4px);
      opacity: 0;
      pointer-events: none;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(12, 12, 16, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f1f1f4;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    .dock-item:hover .dock-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .dock-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.1);
      margin: 0 4px;
    }

    /* Live Status Pill */
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.03);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background 0.2s;
    }
    .status-pill:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .status-glow {
      box-shadow: 0 0 10px #10b981, 0 0 20px rgba(16, 185, 129, 0.4);
    }

    /* Center Command Card & Chat Box */
    .center-glass-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 720px;
      height: calc(100vh - 120px);
      margin: 80px auto 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: text;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 10px;
      scroll-behavior: smooth;
    }

    .message-bubble {
      animation: messagePop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes messagePop {
      0% { opacity: 0; transform: translateY(10px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .assistant-card {
      background: rgba(18, 19, 26, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 18px 22px;
      color: #e2e4ea;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      line-height: 1.65;
    }

    .user-pill {
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
      color: #ffffff;
      border-radius: 20px 20px 4px 20px;
      padding: 12px 20px;
      font-weight: 400;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
    }

    /* Mode Banner */
    .mode-banner {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(168, 85, 247, 0.1);
      border: 1px solid rgba(168, 85, 247, 0.2);
      color: #c084fc;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    /* The Sleek Center Input Box */
    .input-capsule {
      background: rgba(18, 19, 28, 0.75);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 8px 12px 8px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 
        0 20px 50px -10px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .input-capsule:focus-within {
      border-color: rgba(168, 85, 247, 0.5);
      background: rgba(22, 23, 34, 0.9);
      box-shadow: 
        0 24px 60px -10px rgba(0, 0, 0, 0.8),
        0 0 35px rgba(168, 85, 247, 0.2);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

    /* Markdown Styling */
    .markdown-content p { margin-bottom: 0.6rem; }
    .markdown-content pre {
      background: rgba(0, 0, 0, 0.5) !important;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .markdown-content code {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.88em;
    }
    .markdown-content pre code {
      background: transparent;
      padding: 0;
    }

    /* Notification Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(24, 24, 32, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 18px;
      border-radius: 9999px;
      color: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow & 3D Canvas -->
  <div class="ambient-glow"></div>
  <div id="canvas-container"></div>

  <!-- 1. THREEUI ANIMATED TOP DOCK (SABLE CAPSULE) -->
  <nav class="sable-dock-wrapper" id="top-dock">
    <!-- Explore / Reset Button -->
    <button class="dock-item" id="btn-explore" title="New Session">
      <i data-lucide="compass" class="w-4 h-4"></i>
      <span class="dock-tooltip">New Session (Clear)</span>
    </button>

    <div class="dock-divider"></div>

    <!-- Mode 1: General Assistant -->
    <button class="dock-item active" id="btn-mode-general" data-mode="general">
      <i data-lucide="message-square" class="w-4 h-4"></i>
      <span class="dock-tooltip">General Chat</span>
    </button>

    <!-- Mode 2: Creative / Brainstorming -->
    <button class="dock-item" id="btn-mode-creative" data-mode="creative">
      <i data-lucide="sparkles" class="w-4 h-4"></i>
      <span class="dock-tooltip">Creative Mind</span>
    </button>

    <!-- Mode 3: Code Studio -->
    <button class="dock-item" id="btn-mode-code" data-mode="code">
      <i data-lucide="terminal" class="w-4 h-4"></i>
      <span class="dock-tooltip">Code Studio</span>
    </button>

    <div class="dock-divider"></div>

    <!-- Toggle 3D Shape -->
    <button class="dock-item" id="btn-toggle-mesh" title="Switch 3D Geometry">
      <i data-lucide="box" class="w-4 h-4"></i>
      <span class="dock-tooltip">Change 3D Mesh</span>
    </button>

    <!-- Live Status Pill (คลิกเพื่อทดสอบ Ping ได้) -->
    <div class="status-pill" id="btn-ping" title="Click to test latency">
      <span class="w-2 h-2 rounded-full bg-emerald-400 status-glow" id="status-dot"></span>
      <span class="text-xs text-neutral-300 font-mono tracking-wider" id="status-text">vLLM 14B</span>
    </div>

    <!-- Preferences Settings -->
    <button class="dock-item" id="btn-settings" title="Settings">
      <i data-lucide="sliders" class="w-4 h-4"></i>
      <span class="dock-tooltip">Preferences</span>
    </button>
  </nav>

  <!-- 2. CENTER CONTENT & CHAT WORKSPACE -->
  <main class="center-glass-container">
    
    <!-- Messages Scroll Area -->
    <div class="messages-area space-y-5" id="chat-messages">
      <!-- Welcome Intro Card -->
      <div class="text-center my-auto py-16" id="empty-state">
        <div id="current-mode-badge" class="mode-banner">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span id="current-mode-label">Mode: General Chat</span>
        </div>
        <h2 class="text-3xl font-semibold tracking-tight text-white mb-3" id="welcome-title">
          Quiet focus, infinite thoughts.
        </h2>
        <p class="text-neutral-400 text-sm max-w-md mx-auto leading-relaxed mb-6 font-normal" id="welcome-desc">
          A minimal interactive workspace powered by localized neural intelligence. What would you like to explore today?
        </p>

        <!-- Minimal Suggestion Pills -->
        <div class="flex flex-wrap items-center justify-center gap-2 max-w-lg mx-auto" id="suggestion-container">
          <button class="prompt-chip px-3.5 py-1.5 rounded-full bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] hover:border-white/20 text-xs text-neutral-300 transition">
            ☕ เล่าเรื่องสถาปัตยกรรมมินิมอลให้ฟังหน่อย
          </button>
          <button class="prompt-chip px-3.5 py-1.5 rounded-full bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] hover:border-white/20 text-xs text-neutral-300 transition">
            🌌 อธิบายเวลาและมิติที่ 4
          </button>
          <button class="prompt-chip px-3.5 py-1.5 rounded-full bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] hover:border-white/20 text-xs text-neutral-300 transition">
            🎨 ไอเดียคู่สีสำหรับ Dark UI
          </button>
        </div>
      </div>
    </div>

    <!-- 3. CENTER FLOATING CHAT INPUT CAPSULE -->
    <div class="pb-6 px-2">
      <div class="input-capsule">
        <div class="text-neutral-500 pl-1">
          <i data-lucide="command" class="w-4 h-4"></i>
        </div>
        <textarea 
          id="user-input" 
          rows="1" 
          placeholder="ถามอะไรก็ได้ หรือพิมพ์คำสั่ง..." 
          class="w-full bg-transparent text-sm text-white placeholder-neutral-500 outline-none resize-none max-h-32 py-1.5 leading-normal"
        ></textarea>
        
        <button 
          id="btn-send" 
          class="p-2.5 rounded-full bg-white/10 hover:bg-white/20 text-neutral-200 hover:text-white transition disabled:opacity-30 disabled:cursor-not-allowed"
          title="Send"
        >
          <i data-lucide="arrow-up" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="flex items-center justify-between px-3 mt-2.5 text-[11px] text-neutral-500">
        <span class="tracking-wide">Press <kbd class="px-1.5 py-0.5 rounded bg-white/5 border border-white/10 text-neutral-400 font-mono">Enter</kbd> to transmit</span>
        <span class="font-mono opacity-60">Sable Dock Edition</span>
      </div>
    </div>

  </main>

  <!-- Notification Toast -->
  <div id="toast">
    <i data-lucide="info" class="w-4 h-4 text-purple-400"></i>
    <span id="toast-msg">Notification</span>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md">
    <div class="assistant-card w-full max-w-md p-6 border border-white/10 text-white rounded-3xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-semibold flex items-center gap-2">
          <i data-lucide="sliders" class="w-4 h-4 text-purple-400"></i> Workspace Config
        </h3>
        <button id="btn-close-settings" class="text-neutral-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="space-y-4 text-xs">
        <div>
          <label class="block text-neutral-400 mb-1">Inference API Endpoint</label>
          <input type="text" id="api-url-input" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-white font-mono outline-none focus:border-purple-500">
        </div>
        <div>
          <label class="block text-neutral-400 mb-1">Target Model</label>
          <input type="text" id="model-name-input" value="Qwen/Qwen2.5-14B-Instruct" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-white font-mono outline-none focus:border-purple-500">
        </div>
        <button id="btn-save-settings" class="w-full py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 font-medium transition text-white mt-2 shadow-lg shadow-purple-600/30">
          Save Settings
        </button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script>
    // ----------------------------------------------------
    // THREE.JS: Dynamic Geometry Switching
    // ----------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 32;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const geometries = [
      new THREE.IcosahedronGeometry(13, 3),
      new THREE.TorusKnotGeometry(9, 2.6, 120, 24),
      new THREE.OctahedronGeometry(14, 2),
      new THREE.DodecahedronGeometry(13, 1)
    ];
    let currentGeoIdx = 0;

    const wireframeMat = new THREE.MeshBasicMaterial({
      color: 0x475569,
      wireframe: true,
      transparent: true,
      opacity: 0.12
    });
    let currentMesh = new THREE.Mesh(geometries[0], wireframeMat);
    scene.add(currentMesh);

    const pointsMat = new THREE.PointsMaterial({
      color: 0x9333ea,
      size: 0.07,
      transparent: true,
      opacity: 0.4
    });
    let currentPoints = new THREE.Points(geometries[0], pointsMat);
    scene.add(currentPoints);

    function switchMesh() {
      currentGeoIdx = (currentGeoIdx + 1) % geometries.length;
      scene.remove(currentMesh);
      scene.remove(currentPoints);
      currentMesh = new THREE.Mesh(geometries[currentGeoIdx], wireframeMat);
      currentPoints = new THREE.Points(geometries[currentGeoIdx], pointsMat);
      scene.add(currentMesh);
      scene.add(currentPoints);
      showToast('Switched 3D Geometry: ' + ['Icosahedron', 'Torus Knot', 'Octahedron', 'Dodecahedron'][currentGeoIdx]);
    }

    // Mouse Tracking
    let targetX = 0, targetY = 0;
    window.addEventListener('mousemove', (e) => {
      targetX = (e.clientX - window.innerWidth / 2) * 0.0003;
      targetY = (e.clientY - window.innerHeight / 2) * 0.0003;
    });

    function animate() {
      requestAnimationFrame(animate);
      if (currentMesh) {
        currentMesh.rotation.x += 0.001;
        currentMesh.rotation.y += 0.0015;
      }
      if (currentPoints) {
        currentPoints.rotation.x += 0.001;
        currentPoints.rotation.y += 0.0015;
      }

      scene.rotation.y += (targetX - scene.rotation.y) * 0.04;
      scene.rotation.x += (targetY - scene.rotation.x) * 0.04;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ----------------------------------------------------
    // TOAST NOTIFICATION
    // ----------------------------------------------------
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-msg');
    let toastTimeout;
    function showToast(msg) {
      toastMsg.innerText = msg;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // ----------------------------------------------------
    // CHAT & LOGIC
    // ----------------------------------------------------
    lucide.createIcons();

    let API_URL = localStorage.getItem('vllm_api_url') || 'https://privacy-translations-photo-durham.trycloudflare.com/v1';
    let MODEL_NAME = localStorage.getItem('vllm_model_name') || 'Qwen/Qwen2.5-14B-Instruct';
    let conversationHistory = [];

    // System Prompts ตามโหมดบน Dock
    const MODE_PROMPTS = {
      general: 'คุณคือผู้ช่วยอัจฉริยะ ตอบคำถามด้วยภาษาไทยที่สุภาพ เป็นธรรมชาติ กระชับ และถูกต้องตามหลักการ',
      creative: 'คุณคือที่ปรึกษาเชิงสร้างสรรค์ เน้นเสนอไอเดียแปลกใหม่ มุมมองที่น่าสนใจ สร้างแรงบันดาลใจ ตอบเป็นภาษาไทยอย่างมีชีวิตชีวา',
      code: 'You are an elite software architect and senior developer. Provide clean, modern, efficient code with concise technical explanations in Thai.'
    };
    let currentMode = 'general';

    const chatContainer = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const btnSend = document.getElementById('btn-send');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    // ----------------------------------------------------
    // DOCK BUTTON ACTIONS (ทำให้ปุ่มทุกอันทำงานจริง)
    // ----------------------------------------------------
    // 1. New Session (Clear Chat)
    document.getElementById('btn-explore').addEventListener('click', () => {
      conversationHistory = [];
      chatContainer.innerHTML = `
        <div class="text-center my-auto py-16" id="empty-state">
          <div id="current-mode-badge" class="mode-banner">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
            <span id="current-mode-label">Mode: ${currentMode.toUpperCase()}</span>
          </div>
          <h2 class="text-3xl font-semibold tracking-tight text-white mb-3">
            Quiet focus, infinite thoughts.
          </h2>
          <p class="text-neutral-400 text-sm max-w-md mx-auto leading-relaxed mb-6 font-normal">
            New session started. History has been cleared.
          </p>
        </div>
      `;
      lucide.createIcons();
      showToast('New session started (History cleared)');
    });

    // 2. Mode Switchers (General, Creative, Code)
    const modeButtons = [
      { id: 'btn-mode-general', mode: 'general', label: 'General Chat' },
      { id: 'btn-mode-creative', mode: 'creative', label: 'Creative Mind' },
      { id: 'btn-mode-code', mode: 'code', label: 'Code Studio' }
    ];

    modeButtons.forEach(item => {
      const btn = document.getElementById(item.id);
      btn.addEventListener('click', () => {
        modeButtons.forEach(b => document.getElementById(b.id).classList.remove('active'));
        btn.classList.add('active');
        currentMode = item.mode;
        
        const label = document.getElementById('current-mode-label');
        if (label) label.innerText = `Mode: ${item.label}`;
        
        showToast(`Switched to: ${item.label}`);
      });
    });

    // 3. Switch 3D Mesh
    document.getElementById('btn-toggle-mesh').addEventListener('click', switchMesh);

    // 4. Ping Test
    document.getElementById('btn-ping').addEventListener('click', async () => {
      showToast('Testing latency to Colab GPU...');
      const start = performance.now();
      await testConnection();
      const duration = Math.round(performance.now() - start);
      showToast(`Ping: ${duration}ms (GPU Ready)`);
    });

    // 5. Settings Modal
    const modal = document.getElementById('settings-modal');
    const btnSettings = document.getElementById('btn-settings');
    const btnCloseSettings = document.getElementById('btn-close-settings');
    const btnSaveSettings = document.getElementById('btn-save-settings');
    const apiUrlInput = document.getElementById('api-url-input');
    const modelNameInput = document.getElementById('model-name-input');

    apiUrlInput.value = API_URL;
    modelNameInput.value = MODEL_NAME;

    btnSettings.addEventListener('click', () => modal.classList.remove('hidden'));
    btnCloseSettings.addEventListener('click', () => modal.classList.add('hidden'));
    btnSaveSettings.addEventListener('click', () => {
      API_URL = apiUrlInput.value.trim().replace(/\/+$/, '');
      MODEL_NAME = modelNameInput.value.trim();
      localStorage.setItem('vllm_api_url', API_URL);
      localStorage.setItem('vllm_model_name', MODEL_NAME);
      modal.classList.add('hidden');
      testConnection();
      showToast('Preferences updated');
    });

    // Suggestion Prompt Chips
    document.querySelectorAll('.prompt-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        userInput.value = chip.innerText.replace(/^[^\w\sก-๙]+/, '').trim();
        sendMessage();
      });
    });

    // Auto resize
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = userInput.scrollHeight + 'px';
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    btnSend.addEventListener('click', sendMessage);

    async function testConnection() {
      try {
        const res = await fetch(`${API_URL}/models`);
        if (res.ok) {
          statusText.innerText = 'Online';
          statusDot.className = 'w-2 h-2 rounded-full bg-emerald-400 status-glow';
        } else { throw new Error(); }
      } catch {
        statusText.innerText = 'Standby';
        statusDot.className = 'w-2 h-2 rounded-full bg-neutral-500';
      }
    }
    testConnection();

    function appendMessage(role, text) {
      const emptyState = document.getElementById('empty-state');
      if (emptyState) emptyState.remove();

      const msgDiv = document.createElement('div');
      msgDiv.className = `flex gap-3 message-bubble ${role === 'user' ? 'justify-end' : 'justify-start'}`;

      const bubble = document.createElement('div');
      bubble.className = role === 'user' 
        ? 'user-pill max-w-[80%]' 
        : 'assistant-card max-w-[90%] markdown-content';

      if (role === 'user') {
        bubble.innerText = text;
      } else {
        bubble.innerHTML = marked.parse(text);
      }

      msgDiv.appendChild(bubble);
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return bubble;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      userInput.value = '';
      userInput.style.height = 'auto';
      btnSend.disabled = true;

      appendMessage('user', text);
      conversationHistory.push({ role: 'user', content: text });

      const assistantBubble = appendMessage('assistant', '...');
      let fullResponse = '';

      try {
        statusText.innerText = 'Thinking...';
        statusDot.className = 'w-2 h-2 rounded-full bg-purple-400 animate-pulse';

        const response = await fetch(`${API_URL}/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: MODEL_NAME,
            messages: [
              { role: 'system', content: MODE_PROMPTS[currentMode] || MODE_PROMPTS.general },
              ...conversationHistory
            ],
            stream: true,
            temperature: currentMode === 'creative' ? 0.7 : (currentMode === 'code' ? 0.2 : 0.3),
            repetition_penalty: 1.05,
            max_tokens: 2048
          })
        });

        if (!response.ok) throw new Error();

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        assistantBubble.innerHTML = '';
        let sseBuffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          sseBuffer += decoder.decode(value, { stream: true });
          const lines = sseBuffer.split('\n');
          sseBuffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith('data: ') && trimmed !== 'data: [DONE]') {
              try {
                const data = JSON.parse(trimmed.slice(6));
                const token = data.choices[0]?.delta?.content || '';
                fullResponse += token;
                assistantBubble.innerHTML = marked.parse(fullResponse);
                chatContainer.scrollTop = chatContainer.scrollHeight;
              } catch (e) {}
            }
          }
        }

        conversationHistory.push({ role: 'assistant', content: fullResponse });
        statusText.innerText = 'Online';
        statusDot.className = 'w-2 h-2 rounded-full bg-emerald-400 status-glow';

      } catch (err) {
        assistantBubble.innerHTML = `<span class="text-rose-400">⚠️ ไม่สามารถเชื่อมต่อกับ Inference Engine ได้ กรุณาตรวจสอบ Settings</span>`;
        statusText.innerText = 'Offline';
        statusDot.className = 'w-2 h-2 rounded-full bg-rose-500';
      } finally {
        btnSend.disabled = false;
        userInput.focus();
      }
    }
  </script>
</body>
</html>
